<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HollGeniX // VSS — Лента новостей</title>
  <style>
    :root {
      --bg: #070709;
      --surface: #0f1014;
      --surface-2: #16181f;
      --border: rgba(255, 255, 255, 0.14);
      --border-strong: rgba(255, 255, 255, 0.34);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #ffffff;
      --ad-border: #d4af37;
      --ad-bg: rgba(212, 175, 55, 0.08);
      --danger: #ef4444;
      --edit: #93c5fd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button, input, textarea, select {
      font: inherit;
      color: var(--text);
    }

    button {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.88rem;
      border-radius: 4px;
    }

    button:hover {
      border-color: var(--border-strong);
    }

    button.primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 600;
    }

    button.edit-btn {
      border-color: rgba(147, 197, 253, 0.5);
      color: var(--edit);
    }

    button.danger {
      border-color: rgba(239, 68, 68, 0.6);
      color: #fca5a5;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 600;
    }

    .admin-panel {
      display: none;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      padding: 16px;
      margin-bottom: 20px;
      border-radius: 6px;
    }

    .admin-panel.open {
      display: block;
    }

    .admin-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field input[type="text"],
    .field textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 9px 10px;
      border-radius: 4px;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .preview-box {
      margin-top: 8px;
      max-width: 240px;
      border: 1px solid var(--border);
      display: none;
    }

    .preview-box img {
      display: block;
      width: 100%;
      height: auto;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 16px;
      border-radius: 6px;
    }

    .card.is-ad {
      border-color: var(--ad-border);
      background: linear-gradient(180deg, var(--ad-bg), var(--surface));
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .badge {
      border: 1px solid var(--border);
      padding: 2px 7px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge.ad {
      border-color: var(--ad-border);
      color: #facc15;
    }

    .card-title {
      font-size: 1.08rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .card-img {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      display: block;
    }

    .card-body {
      font-size: 0.94rem;
      color: #d1d5db;
      white-space: pre-line;
      margin-bottom: 12px;
    }

    .card-body.collapsed {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .status {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <svg width="42" height="42" viewBox="0 0 100 100" fill="none" aria-label="Логотип HollGeniX VSS">
          <circle cx="50" cy="50" r="46" stroke="#ffffff" stroke-width="2.5"/>
          <circle cx="50" cy="50" r="41" stroke="#ffffff" stroke-width="1"/>
          <polygon points="50,14 16,74 84,74" stroke="#ffffff" stroke-width="2" fill="none"/>
          <circle cx="50" cy="52" r="13" stroke="#ffffff" stroke-width="1.8"/>
          <text x="50" y="56" text-anchor="middle" fill="#ffffff" font-size="10" font-family="sans-serif" letter-spacing="1">VSS</text>
        </svg>
        <div>
          <div class="brand-title">HollGeniX // VSS</div>
          <div class="brand-sub">Общедоступная лента новостей и спецсообщений</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="adminToggleBtn" type="button">Админ-вход</button>
      </div>
    </header>

    <div class="filters">
      <button class="filter-btn active" data-filter="all" type="button">Все</button>
      <button class="filter-btn" data-filter="news" type="button">Новости</button>
      <button class="filter-btn" data-filter="ad" type="button">Реклама</button>
    </div>

    <section id="adminPanel" class="admin-panel" aria-label="Панель публикации">
      <div class="admin-title" id="formHeading">Новая публикация</div>
      <form id="postForm">
        <input type="hidden" id="editId" />
        <div class="field">
          <label for="postTitle">Заголовок</label>
          <input id="postTitle" type="text" placeholder="Короткий заголовок новости" required />
        </div>
        <div class="field">
          <label for="postText">Текст</label>
          <textarea id="postText" placeholder="Основной текст или подробности..." required></textarea>
        </div>
        <div class="field">
          <label for="postImageUrl">Ссылка на фото (или загрузи с устройства ниже)</label>
          <input id="postImageUrl" type="text" placeholder="https://..." />
        </div>
        <div class="field">
          <label for="postFile">Загрузить фото с устройства (автосжатие)</label>
          <input id="postFile" type="file" accept="image/*" />
          <div id="previewBox" class="preview-box"><img id="previewImg" alt="Превью" /></div>
        </div>
        <label class="check-row">
          <input id="postIsAd" type="checkbox" />
          <span>Отметить как рекламу</span>
        </label>
        <div class="card-actions">
          <button class="primary" type="submit" id="submitBtn">Опубликовать</button>
          <button type="button" id="cancelEditBtn" style="display:none;">Отмена редактирования</button>
          <button type="button" id="logoutBtn">Выйти из режима админа</button>
        </div>
        <div id="adminStatus" class="status"></div>
      </form>
    </section>

    <main id="feed" class="feed"></main>
  </div>

  <script>
    const ADMIN_PASS_HASH = "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9";
    const STORAGE_KEY = "hollgenix_vss_posts_v1";

    const DEFAULT_POSTS = [
      {
        id: "1",
        title: "Турист из Монголии в шоке от того, что люди в России едят курицу",
        text: "По словам гостя, он готовился увидеть степные традиции, но столкнулся с целыми витринами жареной птицы. Местные жители объяснили ему, что курица здесь — главный стратегический ресурс после обеда.",
        image: "",
        isAd: false,
        date: "24.11.2026"
      },
      {
        id: "2",
        title: "Осужден самый прослушиваемый DJ в селе за употребление наркотиков",
        text: "Редакция выяснила подробности громкого дела: музыкант слишком громко включал басы по ночам, из-за чего соседи заподозрили запрещённые вещества. Экспертиза нашла в плеере только треки десятилетней давности.",
        image: "",
        isAd: false,
        date: "24.11.2026"
      },
      {
        id: "3",
        title: "90001919101010 рублей сразу, 1 рубль после смерти — будь с нами",
        text: "Специальное предложение от структуры VSS: мгновенное начисление на внутренний баланс и символическая выплата в вечности. Условия действуют при соблюдении протокола молчания.",
        image: "",
        isAd: true,
        date: "24.11.2026"
      },
      {
        id: "4",
        title: "Французский наёмник посетил Уссурийск и рассказал что...",
        text: "После прогулки у въездного знака путешественник заявил, что местные дороги проверяют характер лучше любых горных перевалов. Подробный отчёт обещали опубликовать после сушки обуви.",
        image: "",
        isAd: false,
        date: "24.11.2026"
      },
      {
        id: "5",
        title: "Россия нашла причину массовых засоров туалетов по всей стране!",
        text: "Комиссия проверила городские люки и выяснила, что часть проблем возникает из-за слишком драматичных попыток решить бытовые вопросы. Администрация пообещала держать ситуацию на контроле.",
        image: "",
        isAd: false,
        date: "24.11.2026"
      },
      {
        id: "6",
        title: "Дагестан провёл совместные учения с Монголией, подводим итоги вместе",
        text: "Участники отработали координацию на местности, обмен опытом и дружеские рукопожатия в кадре. Итоговый протокол сошёлся на том, что хороший чай важнее любого брифинга.",
        image: "",
        isAd: false,
        date: "24.11.2026"
      },
      {
        id: "7",
        title: "Инновации в Азербайджане!!! Шок!! Учёный изобрёл телефон !!",
        text: "По утверждению авторов сообщения, устройство позволяет держать связь на расстоянии и смотреть в чёрный экран с умным видом. Технологическое сообщество обсуждает новинку вторые сутки.",
        image: "",
        isAd: false,
        date: "24.11.2026"
      },
      {
        id: "8",
        title: "Французский легион на отдыхе во Владивостоке, во время войны 1984 год",
        text: "Архивная хроника из параллельного календаря показывает привал среди весенней травы и цветущих кустов. Историки отмечают, что в тот год погода была особенно переменчивой.",
        image: "",
        isAd: false,
        date: "24.11.2026"
      },
      {
        id: "9",
        title: "Огромного бобра нашли в лесу России! Местные власти подключили военных",
        text: "Животное заметили рядом с повреждённым стволом дерева в лесной зоне. Специалисты уточняют, был ли это строительный проект или плановая лесозаготовка.",
        image: "",
        isAd: false,
        date: "24.11.2026"
      },
      {
        id: "10",
        title: "В сеть слили клип к новому треку MEDOKK — смотри скорее пока не удалили",
        text: "Кадры с необычным визуальным эффектом и пометкой об ограничении возраста быстро разлетелись по чатам. Поклонники спорят, выйдет ли расширенная версия.",
        image: "",
        isAd: false,
        date: "24.11.2026"
      }
    ];

    let isAdmin = false;
    let currentFilter = "all";
    let uploadedDataUrl = "";

    function loadPosts() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_POSTS));
          return [...DEFAULT_POSTS];
        }
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [...DEFAULT_POSTS];
      } catch (e) {
        return [...DEFAULT_POSTS];
      }
    }

    function savePosts(posts) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
    }

    async function sha256Hex(text) {
      const buf = new TextEncoder().encode(text);
      const hash = await crypto.subtle.digest("SHA-256", buf);
      return Array.from(new Uint8Array(hash))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const maxW = 800;
            const scale = img.width > maxW ? maxW / img.width : 1;
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.72));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderFeed() {
      const feedEl = document.getElementById("feed");
      const posts = loadPosts().filter((p) => {
        if (currentFilter === "news") return !p.isAd;
        if (currentFilter === "ad") return Boolean(p.isAd);
        return true;
      });

      if (!posts.length) {
        feedEl.innerHTML = '<div class="card">Публикаций в этом разделе пока нет.</div>';
        return;
      }

      feedEl.innerHTML = posts
        .map((post) => {
          const adClass = post.isAd ? "is-ad" : "";
          const badge = post.isAd
            ? '<span class="badge ad">Реклама</span>'
            : '<span class="badge">Новость</span>';
          const imgHtml = post.image
            ? `<img class="card-img" src="${escapeHtml(post.image)}" alt="${escapeHtml(post.title)}" />`
            : "";
          const adminButtons = isAdmin
            ? `<button type="button" class="edit-btn" data-edit="${escapeHtml(post.id)}">Редактировать</button>
               <button type="button" class="danger" data-delete="${escapeHtml(post.id)}">Удалить</button>`
            : "";

          return `
            <article class="card ${adClass}" data-id="${escapeHtml(post.id)}">
              <div class="card-top">
                ${badge}
                <span>${escapeHtml(post.date || "")}</span>
              </div>
              <h2 class="card-title">${escapeHtml(post.title)}</h2>
              ${imgHtml}
              <div class="card-body collapsed" id="body-${escapeHtml(post.id)}">${escapeHtml(post.text)}</div>
              <div class="card-actions">
                <button type="button" data-more="${escapeHtml(post.id)}">Подробнее</button>
                ${adminButtons}
              </div>
            </article>
          `;
        })
        .join("");
    }

    function setPreview(src) {
      const box = document.getElementById("previewBox");
      const img = document.getElementById("previewImg");
      if (src) {
        img.src = src;
        box.style.display = "block";
      } else {
        img.src = "";
        box.style.display = "none";
      }
    }

    function resetForm() {
      document.getElementById("editId").value = "";
      document.getElementById("postTitle").value = "";
      document.getElementById("postText").value = "";
      document.getElementById("postImageUrl").value = "";
      document.getElementById("postFile").value = "";
      document.getElementById("postIsAd").checked = false;
      document.getElementById("formHeading").textContent = "Новая публикация";
      document.getElementById("submitBtn").textContent = "Опубликовать";
      document.getElementById("cancelEditBtn").style.display = "none";
      uploadedDataUrl = "";
      setPreview("");
    }

    document.getElementById("adminToggleBtn").addEventListener("click", async () => {
      const panel = document.getElementById("adminPanel");
      if (isAdmin) {
        panel.classList.toggle("open");
        return;
      }
      const pass = prompt("Введите пароль администратора:");
      if (!pass) return;
      const hash = await sha256Hex(pass);
      if (hash === ADMIN_PASS_HASH) {
        isAdmin = true;
        panel.classList.add("open");
        document.getElementById("adminToggleBtn").textContent = "Панель админа";
        renderFeed();
      } else {
        alert("Неверный пароль.");
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      isAdmin = false;
      resetForm();
      document.getElementById("adminPanel").classList.remove("open");
      document.getElementById("adminToggleBtn").textContent = "Админ-вход";
      renderFeed();
    });

    document.getElementById("cancelEditBtn").addEventListener("click", resetForm);

    document.getElementById("postFile").addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        uploadedDataUrl = await compressImage(file);
        document.getElementById("postImageUrl").value = "";
        setPreview(uploadedDataUrl);
        document.getElementById("adminStatus").textContent = "Фото подготовлено.";
      } catch (err) {
        document.getElementById("adminStatus").textContent = "Не удалось обработать фото.";
      }
    });

    document.getElementById("postImageUrl").addEventListener("input", (e) => {
      const val = e.target.value.trim();
      if (val) {
        uploadedDataUrl = "";
        setPreview(val);
      } else if (!uploadedDataUrl) {
        setPreview("");
      }
    });

    document.getElementById("postForm").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!isAdmin) return;

      const editId = document.getElementById("editId").value;
      const title = document.getElementById("postTitle").value.trim();
      const text = document.getElementById("postText").value.trim();
      const urlVal = document.getElementById("postImageUrl").value.trim();
      const isAd = document.getElementById("postIsAd").checked;
      const image = uploadedDataUrl || urlVal || "";

      const posts = loadPosts();
      if (editId) {
        const idx = posts.findIndex((p) => p.id === editId);
        if (idx !== -1) {
          posts[idx] = {
            ...posts[idx],
            title,
            text,
            image: image || posts[idx].image,
            isAd
          };
        }
      } else {
        posts.unshift({
          id: String(Date.now()),
          title,
          text,
          image,
          isAd,
          date: new Date().toLocaleDateString("ru-RU")
        });
      }

      savePosts(posts);
      resetForm();
      renderFeed();
      document.getElementById("adminStatus").textContent = "Сохранено в локальном хранилище этого браузера.";
    });

    document.getElementById("feed").addEventListener("click", (e) => {
      const target = e.target.closest("button");
      if (!target) return;

      const moreId = target.getAttribute("data-more");
      if (moreId) {
        const bodyEl = document.getElementById("body-" + moreId);
        if (bodyEl) {
          const isCollapsed = bodyEl.classList.toggle("collapsed");
          target.textContent = isCollapsed ? "Подробнее" : "Свернуть";
        }
        return;
      }

      const editId = target.getAttribute("data-edit");
      if (editId && isAdmin) {
        const post = loadPosts().find((p) => p.id === editId);
        if (!post) return;
        document.getElementById("editId").value = post.id;
        document.getElementById("postTitle").value = post.title;
        document.getElementById("postText").value = post.text;
        document.getElementById("postImageUrl").value = post.image && !post.image.startsWith("data:") ? post.image : "";
        document.getElementById("postIsAd").checked = Boolean(post.isAd);
        document.getElementById("formHeading").textContent = "Редактирование публикации";
        document.getElementById("submitBtn").textContent = "Сохранить изменения";
        document.getElementById("cancelEditBtn").style.display = "inline-block";
        document.getElementById("adminPanel").classList.add("open");
        uploadedDataUrl = post.image && post.image.startsWith("data:") ? post.image : "";
        setPreview(post.image || "");
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      const delId = target.getAttribute("data-delete");
      if (delId && isAdmin) {
        const updated = loadPosts().filter((p) => p.id !== delId);
        savePosts(updated);
        renderFeed();
      }
    });

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.getAttribute("data-filter");
        renderFeed();
      });
    });

    renderFeed();
  </script>
</body>
</html>
